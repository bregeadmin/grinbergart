<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Учёт ремонта / Renovation budget</title>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --muted:#6b7280;
    --line:#e5e7eb; --brand:#0f766e; --brand-d:#0b5c56;
    --mat:#2563eb; --work:#9333ea; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.4;
    -webkit-font-smoothing:antialiased; padding-bottom:calc(76px + var(--safe-b));
  }
  .app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
  header.top{
    position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  header.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
  header.top .sub{font-size:12.5px;opacity:.85;margin-top:2px}
  .langbtn{flex:0 0 auto;background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:700;
    font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
  .langbtn:active{transform:scale(.96)}
  main{padding:14px 14px 24px}
  .view{display:none}
  .view.active{display:block;animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}

  .bcard{position:relative;overflow:hidden}
  .bcard .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:999px;color:#fff}
  .tag.mat{background:var(--mat)} .tag.work{background:var(--work)}
  .bignum{font-size:26px;font-weight:800;margin:10px 0 2px;letter-spacing:-.5px}
  .bignum small{font-size:14px;font-weight:600;color:var(--muted)}
  .brow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
  .brow b{color:var(--ink);font-weight:700}
  .bar{height:10px;border-radius:999px;background:var(--line);margin-top:10px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
  .hint.warn{color:var(--warn);font-weight:600} .hint.bad{color:var(--bad);font-weight:700}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px;color:var(--muted)}
  .kpi .val{font-size:18px;font-weight:800;margin-top:3px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:12px 16px;background:var(--line);color:var(--ink)}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.block{width:100%}
  .btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
  .btn.ghost{background:transparent;color:var(--brand)}
  .btn:active{transform:scale(.98)}

  .item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px}
  .thumb{width:46px;height:46px;border-radius:10px;flex:0 0 auto;background:var(--line);
    display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .item .mid{flex:1;min-width:0}
  .item .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .item .amt{font-weight:800;font-size:15px;white-space:nowrap}
  .pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;vertical-align:middle}
  .pill.mat{background:var(--mat)} .pill.work{background:var(--work)}

  svg.i{display:inline-block;vertical-align:middle;flex:0 0 auto}
  [data-icon]{display:inline-flex;align-items:center}
  .thumb.mat{color:var(--mat)} .thumb.work{color:var(--work)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .empty .em{margin-bottom:10px;color:#c3c8d0;display:flex;justify-content:center}

  .daygroup{margin-bottom:16px}
  .dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 4px 8px}
  .dayhead .dl{font-size:13.5px;font-weight:700;color:var(--ink);text-transform:capitalize}
  .dayhead .dc{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:6px;text-transform:none}
  .dayhead .dsum{font-size:14px;font-weight:800;white-space:nowrap}

  .filterbar{display:flex;gap:8px;margin-bottom:12px}
  .seg{display:flex;background:var(--line);border-radius:12px;padding:3px;flex:1}
  .seg button{flex:1;border:none;background:transparent;padding:8px 6px;font-size:13px;font-weight:600;color:var(--muted);border-radius:9px;cursor:pointer;font-family:inherit}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  input.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit;background:#fff}

  .shop-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px}
  .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#fff}
  .chk.done{background:var(--ok);border-color:var(--ok)}
  .shop-item.done .t1{text-decoration:line-through;color:var(--muted)}

  .fab{position:fixed;right:16px;bottom:calc(84px + var(--safe-b));z-index:30;width:58px;height:58px;border-radius:50%;
    background:var(--brand);color:#fff;border:none;font-size:30px;line-height:1;box-shadow:0 6px 16px rgba(15,118,110,.45);cursor:pointer}
  .fab:active{transform:scale(.94)}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fff;border-top:1px solid var(--line);
    display:flex;max-width:560px;margin:0 auto;padding-bottom:var(--safe-b)}
  nav.tabs button{flex:1;border:none;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;color:var(--muted);font-family:inherit;cursor:pointer;font-weight:600}
  nav.tabs button .ic{font-size:21px;line-height:1}
  nav.tabs button.on{color:var(--brand)}

  .sheet-bg{position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex;animation:fade .15s ease}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
    padding:8px 16px calc(24px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:40px;height:5px;background:var(--line);border-radius:999px;margin:8px auto 12px}
  .sheet h3{margin:2px 0 14px;font-size:18px}
  label.fld{display:block;margin-bottom:12px}
  label.fld > span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff}
  .inp:focus{outline:none;border-color:var(--brand)}
  textarea.inp{resize:vertical;min-height:52px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .typesel{display:flex;gap:8px;margin-bottom:12px}
  .typesel button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);font-family:inherit}
  .typesel button.on.mat{border-color:var(--mat);color:var(--mat);background:#eff6ff}
  .typesel button.on.work{border-color:var(--work);color:var(--work);background:#faf5ff}

  .photo-zone{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;margin-bottom:12px}
  .photo-zone img{max-width:100%;max-height:220px;border-radius:10px;margin-bottom:10px}
  .ocr-status{font-size:12.5px;color:var(--muted);margin-top:6px}
  .amount-suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
  .amount-suggest button{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

  .divider{height:1px;background:var(--line);margin:14px 0}
  .danger{color:var(--bad)}
  .toast{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%);
    background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:120;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .mini{font-size:12px;color:var(--muted)}
  .catchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .catchips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .catchips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .codebox{font-size:24px;font-weight:800;letter-spacing:3px;color:var(--brand)}

  /* onboarding */
  .onboard{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--brand),var(--brand-d));
    display:none;align-items:center;justify-content:center;padding:24px}
  .onboard.show{display:flex}
  .ob-card{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:410px;box-shadow:0 12px 44px rgba(0,0,0,.28)}
  .ob-logo{width:58px;height:58px;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .ob-card h2{margin:0 0 6px;text-align:center;font-size:21px}
  .ob-card .obp{text-align:center;margin:0 0 20px}
  .ob-status{margin-top:12px;text-align:center;min-height:18px;font-weight:600}
  .ob-status.err{color:var(--bad)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="objName">Учёт ремонта</h1>
      <div class="sub" data-i18n="header_sub"></div>
    </div>
    <button class="langbtn" id="langBtn" onclick="toggleLang()">EN</button>
  </header>

  <main>
    <!-- HOME -->
    <section class="view active" id="v-home">
      <div class="card bcard" id="card-mat"></div>
      <div class="card bcard" id="card-work"></div>
      <div class="kpis" style="margin-bottom:14px">
        <div class="kpi"><div class="lbl" data-i18n="kpi_spent"></div><div class="val" id="kpiSpent">—</div></div>
        <div class="kpi"><div class="lbl" data-i18n="kpi_left"></div><div class="val" id="kpiLeft">—</div></div>
      </div>
      <div class="card" id="forecastCard" style="display:none">
        <h2 data-i18n="forecast_title"></h2>
        <div id="forecastBody"></div>
      </div>
      <div class="card">
        <h2 data-i18n="recent_title"></h2>
        <div id="recentList"></div>
        <button class="btn ghost block" data-i18n="all_receipts" onclick="go('receipts')" style="margin-top:4px"></button>
      </div>
    </section>

    <!-- RECEIPTS -->
    <section class="view" id="v-receipts">
      <div class="filterbar">
        <div class="seg" id="recSeg">
          <button data-f="all" class="on" data-i18n="seg_all"></button>
          <button data-f="material" data-i18n="mat"></button>
          <button data-f="work" data-i18n="work"></button>
        </div>
      </div>
      <input class="search" id="recSearch" data-i18n-ph="search_ph" oninput="renderReceipts()">
      <div id="recTotals" class="mini" style="margin:10px 2px"></div>
      <div id="receiptList"></div>
    </section>

    <!-- SHOP -->
    <section class="view" id="v-shop">
      <div class="card">
        <div class="row">
          <div>
            <div class="mini" data-i18n="shop_need"></div>
            <div class="val" id="shopPlanned" style="font-size:22px;font-weight:800">—</div>
          </div>
          <button class="btn primary sm" data-i18n="shop_add" onclick="openShop()"></button>
        </div>
        <div id="shopVariance" style="display:none"></div>
      </div>
      <div class="filterbar">
        <div class="seg" id="shopSeg">
          <button data-f="todo" class="on" data-i18n="seg_todo"></button>
          <button data-f="done" data-i18n="seg_done"></button>
          <button data-f="all" data-i18n="seg_all"></button>
        </div>
      </div>
      <div id="shopList"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="v-set">
      <div class="card">
        <h2 data-i18n="sync_title"></h2>
        <div class="mini" data-i18n="sync_code_lbl" style="margin-bottom:6px"></div>
        <div class="row" style="margin-bottom:14px">
          <div class="codebox" id="setCode">—</div>
          <button class="btn sm" onclick="shareCode()"><span data-icon="share" data-isize="16"></span><span data-i18n="sync_share"></span></button>
        </div>
        <label class="fld"><span data-i18n="sync_name"></span>
          <input class="inp" id="setMeName" data-i18n-ph="sync_name_ph"></label>
        <button class="btn primary block" onclick="saveMeName()" data-i18n="save"></button>
        <button class="btn block danger" style="margin-top:10px" onclick="leaveProjectConfirm()" data-i18n="sync_leave"></button>
      </div>
      <div class="card">
        <h2 data-i18n="set_obj_title"></h2>
        <label class="fld"><span data-i18n="set_name"></span>
          <input class="inp" id="setName" data-i18n-ph="set_name_ph"></label>
        <label class="fld"><span data-i18n="set_cur"></span>
          <select class="inp" id="setCur">
            <option value="₾">₾ GEL — ლარი / лари</option>
            <option value="$">$ USD</option>
            <option value="€">€ EUR</option>
            <option value="₽">₽ RUB</option>
          </select></label>
        <div class="two">
          <label class="fld"><span data-i18n="set_bud_mat"></span>
            <input class="inp" id="setBudMat" type="number" inputmode="decimal" placeholder="0"></label>
          <label class="fld"><span data-i18n="set_bud_work"></span>
            <input class="inp" id="setBudWork" type="number" inputmode="decimal" placeholder="0"></label>
        </div>
        <button class="btn primary block" data-i18n="save" onclick="saveSettings()"></button>
      </div>
      <div class="card">
        <h2 data-i18n="set_data_title"></h2>
        <p class="mini" style="margin-top:0" data-i18n="set_data_note"></p>
        <button class="btn block" onclick="exportJSON()" style="margin-bottom:10px"><span data-icon="download" data-isize="18"></span><span data-i18n="backup_btn"></span></button>
        <button class="btn block" onclick="exportCSV()" style="margin-bottom:10px"><span data-icon="grid" data-isize="18"></span><span data-i18n="csv_btn"></span></button>
        <button class="btn block danger" onclick="wipe()"><span data-icon="trash" data-isize="18"></span><span data-i18n="wipe_btn"></span></button>
      </div>
      <div class="card">
        <h2 data-i18n="howto_title"></h2>
        <p class="mini" style="margin:0" data-i18n="howto_body"></p>
        <p class="mini" style="margin-top:10px" data-i18n="howto_tip"></p>
      </div>
    </section>
  </main>

  <button class="fab" id="fab" onclick="openReceipt()"><span data-icon="plus" data-isize="26"></span></button>

  <nav class="tabs">
    <button data-v="home" class="on" onclick="go('home')"><span class="ic" data-icon="home" data-isize="23"></span><span data-i18n="tab_home"></span></button>
    <button data-v="receipts" onclick="go('receipts')"><span class="ic" data-icon="receipt" data-isize="23"></span><span data-i18n="tab_receipts"></span></button>
    <button data-v="shop" onclick="go('shop')"><span class="ic" data-icon="cart" data-isize="23"></span><span data-i18n="tab_shop"></span></button>
    <button data-v="set" onclick="go('set')"><span class="ic" data-icon="settings" data-isize="23"></span><span data-i18n="tab_set"></span></button>
  </nav>
</div>

<!-- ONBOARDING -->
<div class="onboard" id="onboard">
  <div class="ob-card">
    <div class="ob-logo"><span data-icon="receipt" data-isize="28"></span></div>
    <h2 data-i18n="ob_title"></h2>
    <p class="mini obp" data-i18n="ob_sub"></p>
    <div id="obCreate">
      <label class="fld"><span data-i18n="ob_name"></span>
        <input class="inp" id="obName" data-i18n-ph="set_name_ph"></label>
      <button class="btn primary block" onclick="obCreate()" data-i18n="ob_create_btn"></button>
      <button class="btn ghost block" style="margin-top:8px" onclick="obShow('join')" data-i18n="ob_have_code"></button>
    </div>
    <div id="obJoin" style="display:none">
      <label class="fld"><span data-i18n="ob_code"></span>
        <input class="inp" id="obCode" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px;font-weight:700" placeholder="ABC123"></label>
      <button class="btn primary block" onclick="obJoin()" data-i18n="ob_join_btn"></button>
      <button class="btn ghost block" style="margin-top:8px" onclick="obShow('create')" data-i18n="ob_new"></button>
    </div>
    <div class="ob-status mini" id="obStatus"></div>
  </div>
</div>

<!-- SHEET: receipt -->
<div class="sheet-bg" id="sheetReceipt">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="recTitle"></h3>
    <div class="typesel" id="recType">
      <button data-t="material" class="on mat"><span data-icon="box" data-isize="18"></span><span data-i18n="mat"></span></button>
      <button data-t="work" class="work"><span data-icon="wrench" data-isize="18"></span><span data-i18n="work"></span></button>
    </div>

    <div class="photo-zone" id="photoZone">
      <div id="photoPreview"></div>
      <label class="btn sm" style="margin-right:6px"><span data-icon="camera" data-isize="16"></span><span data-i18n="photo_btn"></span>
        <input type="file" accept="image/*" capture="environment" style="display:none" id="photoInput" onchange="onPhoto(event)"></label>
      <button class="btn sm" id="ocrBtn" style="display:none" onclick="runOCR()"></button>
      <div class="ocr-status" id="ocrStatus"></div>
      <div class="amount-suggest" id="amountSuggest"></div>
    </div>

    <div class="two">
      <label class="fld"><span data-i18n="f_amount"></span>
        <input class="inp" id="recAmount" type="number" inputmode="decimal" placeholder="0"></label>
      <label class="fld"><span data-i18n="f_date"></span>
        <input class="inp" id="recDate" type="date"></label>
    </div>
    <div id="budgetHint" class="mini" style="display:none;margin:-6px 2px 12px;color:var(--brand);font-weight:600"></div>
    <label class="fld"><span data-i18n="f_cat"></span>
      <input class="inp" id="recCat" list="catlist" data-i18n-ph="f_cat_ph">
      <datalist id="catlist"></datalist>
      <div class="catchips" id="catChips"></div>
    </label>
    <label class="fld"><span data-i18n="f_store"></span>
      <input class="inp" id="recStore" data-i18n-ph="f_store_ph"></label>
    <label class="fld"><span data-i18n="f_note"></span>
      <textarea class="inp" id="recNote" data-i18n-ph="f_note_ph"></textarea></label>

    <button class="btn primary block" data-i18n="save_receipt" onclick="saveReceipt()"></button>
    <button class="btn block danger" id="recDelBtn" data-i18n="del_receipt" style="display:none;margin-top:10px" onclick="deleteReceipt()"></button>
    <button class="btn ghost block" data-i18n="cancel" style="margin-top:6px" onclick="closeSheet('sheetReceipt')"></button>
  </div>
</div>

<!-- SHEET: shopping -->
<div class="sheet-bg" id="sheetShop">
  <div class="sheet">
    <div class="grab"></div>
    <h3 id="shopTitle"></h3>
    <div class="typesel" id="shopType">
      <button data-t="material" class="on mat"><span data-icon="box" data-isize="18"></span><span data-i18n="mat"></span></button>
      <button data-t="work" class="work"><span data-icon="wrench" data-isize="18"></span><span data-i18n="work"></span></button>
    </div>

/* ============ Cloud data layer (Firestore) ============ */
function projRef(){return fs.collection('projects').doc(projectCode);}
function clean(val){const o={};Object.keys(val).forEach(k=>{if(val[k]!==undefined)o[k]=val[k];});return o;}
async function cloudPut(store,val){
  if(store==='settings'){
    await projRef().set(clean({name:settings.name,cur:settings.cur,budMat:settings.budMat,budWork:settings.budWork}),{merge:true});
    return;
  }
  await projRef().collection(store).doc(val.id).set(clean(val));
}
async function cloudDel(store,id){ await projRef().collection(store).doc(id).delete(); }
async function cloudClear(store){
  const qs=await projRef().collection(store).get();
  const batch=fs.batch(); qs.forEach(d=>batch.delete(d.ref)); await batch.commit();
}
let unsubs=[];
function detachListeners(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];}
function attachListeners(){
  detachListeners();
  unsubs.push(projRef().onSnapshot(doc=>{
    if(doc.exists){
      const d=doc.data();
      settings.name=d.name||''; settings.cur=d.cur||'₾';
      settings.budMat=Number(d.budMat)||0; settings.budWork=Number(d.budWork)||0;
      applyHeader(); renderHome();
      const setCode=document.getElementById('setCode'); if(setCode)setCode.textContent=projectCode||'—';
    }
  },err=>console.warn('proj',err)));
  unsubs.push(projRef().collection('receipts').onSnapshot(qs=>{
    receipts=qs.docs.map(d=>Object.assign({id:d.id},d.data())); refreshAll();
  },err=>console.warn('receipts',err)));
  unsubs.push(projRef().collection('shopping').onSnapshot(qs=>{
    shopping=qs.docs.map(d=>Object.assign({id:d.id},d.data())); refreshAll();
  },err=>console.warn('shopping',err)));
}

/* ============ Project create / join / leave ============ */
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
async function createProject(name){
  let code=genCode();
  await fs.collection('projects').doc(code).set({name:name||'',cur:'₾',budMat:0,budWork:0,createdAt:Date.now()});
  setProject(code);
}
async function joinProject(code){
  const doc=await fs.collection('projects').doc(code).get();
  if(!doc.exists)return false;
  setProject(code); return true;
}
function setProject(code){
  projectCode=code; lsSet('remont_project',code);
  hideOnboarding(); attachListeners(); go('home');
}
function leaveProject(){
  detachListeners(); projectCode=null; lsDel('remont_project');
  receipts=[]; shopping=[]; settings={name:'',cur:'₾',budMat:0,budWork:0};

/* ============ Format ============ */
function locale(){return lang==='en'?'en-US':'ru-RU';}
function money(n){
  n=Number(n)||0;
  const s=n.toLocaleString(locale(),{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});
  return s+' '+settings.cur;
}
function shortDate(iso){ if(!iso)return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(locale(),{day:'2-digit',month:'short'}); }
function fullDate(iso){
  if(!iso||iso==='—') return t('no_date');
  const d=new Date(iso+'T00:00:00');
  const today=todayISO();
  const y=new Date(); y.setDate(y.getDate()-1);
  const yIso=new Date(y.getTime()-y.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const base=d.toLocaleDateString(locale(),{weekday:'short',day:'numeric',month:'long'});
  if(iso===today) return t('today')+' · '+base;
  if(iso===yIso) return t('yesterday')+' · '+base;
  return base;
}
function todayISO(){const d=new Date();const o=d.getTimezoneOffset();const x=new Date(d.getTime()-o*60000);return x.toISOString().slice(0,10);}

function spentBy(type){return receipts.filter(r=>r.type===type).reduce((s,r)=>s+(Number(r.amount)||0),0);}
function plannedBy(type){return shopping.filter(s=>s.type===type&&!s.done).reduce((s,r)=>s+(Number(r.amount)||0),0);}
function budgetCard(type){
  const isMat=type==='material';
  const budget=isMat?settings.budMat:settings.budWork;
  const spent=spentBy(type);
  const left=budget-spent;
  const pct=budget>0?Math.min(100,spent/budget*100):0;
  const over=budget>0&&spent>budget;
  const near=budget>0&&!over&&pct>=85;
  let color=over?'var(--bad)':(near?'var(--warn)':'var(--ok)');
  const cls=isMat?'mat':'work';
  let hint='';
  if(budget<=0){hint=`<div class="hint">${t('no_budget')}</div>`;}
  else if(over){hint=`<div class="hint bad">${t('over_by',money(spent-budget))}</div>`;}
  else if(near){hint=`<div class="hint warn">${t('near_warn')}</div>`;}
  else {hint=`<div class="hint">${t('used_pct',Math.round(pct))}</div>`;}
  return `
    <span class="tag ${cls}">${icon(isMat?'box':'wrench',14)} ${t(isMat?'mat':'work')}</span>
    <div class="bignum">${money(left<0?0:left)} <small>${left<0?t('over_word'):t('left_word')}</small></div>
    <div class="bar"><i style="width:${pct}%;background:${color}"></i></div>
    <div class="brow"><span>${t('spent_lbl')} <b>${money(spent)}</b></span><span>${t('budget_lbl')} <b>${money(budget)}</b></span></div>
    ${hint}`;
}

function planVariance(){
  let saved=0, over=0;
  shopping.forEach(s=>{
    if(s.done && s.actual!=null && Number(s.amount)>0){
      const d=Number(s.amount)-Number(s.actual);
      if(d>0)saved+=d; else over+=-d;
    }
  });
  return {saved,over,net:saved-over};
}

/* ============ Photo + OCR (Google Vision) ============ */
function onPhoto(e){
  const file=e.target.files[0]; if(!file)return;
  compressImage(file,1100,0.6).then(dataUrl=>{
    curPhoto=dataUrl;
    document.getElementById('photoPreview').innerHTML=`<img src="${dataUrl}">`;
    document.getElementById('ocrBtn').style.display='inline-flex';
    document.getElementById('ocrStatus').textContent=t('t_photo_added');
  });
}
function compressImage(file,maxDim,quality){
  return new Promise(res=>{
    const img=new Image();
    const reader=new FileReader();
    reader.onload=()=>{img.src=reader.result;};
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(Math.max(w,h)>maxDim){const k=maxDim/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',quality));
    };
    reader.readAsDataURL(file);
  });
}
async function runOCR(){
  if(!curPhoto){toast(t('t_no_photo'));return;}
  const st=document.getElementById('ocrStatus');
  st.textContent=t('ocr_recognizing');
  try{
    const b64=curPhoto.split(',')[1];
    const resp=await fetch('/api/vision',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64})
    });
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok||data.error){ st.textContent=t('ocr_fail'); return; }
    const text=data.text||'';
    const cands=extractAmounts(text);
    if(cands.length){
      st.textContent=t('ocr_pick');
      document.getElementById('amountSuggest').innerHTML=cands.map(v=>`<button type="button" onclick="pickAmount(${v})">${money(v)}</button>`).join('');
      if(!document.getElementById('recAmount').value)document.getElementById('recAmount').value=cands[0];
    } else { st.textContent=t('ocr_none'); }
  }catch(err){ st.textContent=t('ocr_fail'); }
}
function pickAmount(v){document.getElementById('recAmount').value=v;toast(t('t_amount_set'));}
const TOTAL_KW=/(სულ|ჯამი|გადასახდელი|თანხა|ჯამური|итог|итого|всего|сумма|к оплате|total|amount due|amount|balance|to pay|grand total)/i;
function parseNum(raw){
  let norm=String(raw).replace(/\s/g,'');
  if(/[.,]\d{2}$/.test(norm)){ norm=norm.replace(/[.,](?=\d{3})/g,'').replace(',', '.'); }
  else { norm=norm.replace(/[.,]/g,''); }
  const v=parseFloat(norm);
  return (v>=1 && v<10000000)?v:null;
}
function extractAmounts(text){
  const numRe=/\d{1,3}(?:[ .,]\d{3})*(?:[.,]\d{2})?|\d+[.,]\d{2}|\d+/g;
  const priority=[], all=[];
  text.split(/\n+/).forEach(line=>{
    const hasKw=TOTAL_KW.test(line);
    const found=line.match(numRe)||[];
    found.forEach(raw=>{ const v=parseNum(raw); if(v==null)return; all.push(v); if(hasKw)priority.push(v); });
  });
  return [...new Set([...priority.sort((a,b)=>b-a), ...all.sort((a,b)=>b-a)])].slice(0,6);
}

  const name=document.getElementById('shopName').value.trim();
  if(!name){toast(t('t_need_name'));return;}
  const s=editingShop?Object.assign({},editingShop):{id:uid(),createdAt:Date.now(),done:false};
  s.type=curType;
  s.name=name;
  s.cat=document.getElementById('shopCat').value.trim();
  s.amount=parseFloat(document.getElementById('shopAmount').value)||0;
  const wasEdit=!!editingShop;
  await cloudPut('shopping',s);
  closeSheet('sheetShop');toast(wasEdit?t('t_upd'):t('t_added_list'));
}
async function deleteShop(){
  if(!editingShop)return;
  await cloudDel('shopping',editingShop.id);
  closeSheet('sheetShop');toast(t('t_del'));
}
function shopToReceipt(){
  if(!editingShop)return;
  const id=editingShop.id;
  closeSheet('sheetShop');
  buyShop(id);
}

/* ============ Settings ============ */
function fillSettings(){
  document.getElementById('setName').value=settings.name||'';
  document.getElementById('setCur').value=settings.cur;
  document.getElementById('setBudMat').value=settings.budMat||'';
  document.getElementById('setBudWork').value=settings.budWork||'';
  document.getElementById('setCode').textContent=projectCode||'—';
  document.getElementById('setMeName').value=meName||'';
}
async function saveSettings(){
  settings.name=document.getElementById('setName').value.trim();
  settings.cur=document.getElementById('setCur').value;
  settings.budMat=parseFloat(document.getElementById('setBudMat').value)||0;
  settings.budWork=parseFloat(document.getElementById('setBudWork').value)||0;
  await cloudPut('settings',settings);
  applyHeader();toast(t('t_saved'));go('home');
}
function applyHeader(){
  document.getElementById('objName').textContent=settings.name || (lang==='en'?'Renovation budget':'Учёт ремонта');
}

/* ============ Export ============ */
function exportJSON(){
  const data={version:2,exportedAt:new Date().toISOString(),code:projectCode,settings,receipts,shopping};
  downloadFile(JSON.stringify(data,null,2),'application/json',`remont-backup-${todayISO()}.json`);
  toast(t('t_backup_saved'));
}
function exportCSV(){
  const head=lang==='en'?['Date','Type','Category','Store','Amount','By','Note']:['Дата','Тип','Категория','Магазин','Сумма','Кто','Комментарий'];
  const rows=[head];
  const tp={material:t('mat'),work:t('work')};
  [...receipts].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=>{
    rows.push([r.date||'',tp[r.type]||r.type,r.cat||'',r.store||'',String(r.amount||0).replace('.',','),r.by||'',(r.note||'').replace(/[\n\r]+/g,' ')]);
  });
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  downloadFile(csv,'text/csv',`remont-cheki-${todayISO()}.csv`);
  toast(t('t_csv'));
}
function downloadFile(content,type,name){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
}
async function wipe(){
  if(!confirm(t('confirm_wipe')))return;
  await cloudClear('receipts');await cloudClear('shopping');
  toast(t('t_wiped'));
}

/* ============ Utils ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function plural(n,one,few,many){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return many;if(n1>1&&n1<5)return few;if(n1===1)return one;return many;}
let toastT=null;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1900);}
function openSheet(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';}
function closeSheet(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
document.querySelectorAll('.sheet-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)closeSheet(bg.id);}));
document.getElementById('recSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;recFilter=b.dataset.f;document.querySelectorAll('#recSeg button').forEach(x=>x.classList.toggle('on',x===b));renderReceipts();});
document.getElementById('shopSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;shopFilter=b.dataset.f;document.querySelectorAll('#shopSeg button').forEach(x=>x.classList.toggle('on',x===b));renderShop();});
function refreshAll(){renderHome();renderReceipts();renderShop();}

/* ============ Init ============ */
function init(){
  lang=lsGet('remont_lang')||'ru';
  meName=lsGet('remont_name')||'';
  applyLang(); applyIcons(); applyHeader(); renderHome();
  const saved=lsGet('remont_project');
  if(saved && fs){ projectCode=saved; attachListeners(); }
  else { showOnboarding(); }
}
init();
</script>
